type User {
  id: ID!
  email: String!
}

type SupplierCompany {
  id: ID!
  name: String!
  members: [SupplierMembership!]!
}

type SupplierMembership {
  user: User!
  role: SupplierRole!
  validFrom: String!
  validUntil: String
}

enum SupplierRole {
  OWNER
  MANAGER
}

type Product {
  id: ID!
  name: String!
  price: String
}

type ProductConnection {
  nodes: [Product!]!
  pageInfo: PageInfo!
}

type Cart {
  contents: CartItemConnection
}

type CartItem {
  key: ID!
  quantity: Int!
  product: Product
}

type CartItemConnection {
  nodes: [CartItem!]!
  pageInfo: PageInfo!
}

input AddToCartInput {
  clientMutationId: String
  productId: Int!
  quantity: Int
}

type AddToCartPayload {
  cart: Cart
  clientMutationId: String
}

type Order {
  id: ID!
  databaseId: Int!
  status: OrderStatusEnum
  transactionId: String
  total: String
  currency: String
  lineItems: OrderLineItemConnection
  paymentMethod: PaymentMethod!
  workflow: OrderWorkflow!
  pixCode: String
}

type OrderLineItemConnection {
  nodes: [OrderLineItem!]!
}

type OrderLineItem {
  quantity: Int
  product: Product
}

type Customer {
  id: ID!
  orders(first: Int, after: String): OrderConnection
}

type OrderConnection {
  nodes: [Order!]!
  pageInfo: PageInfo!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

enum OrderStatusEnum {
  COMPLETED
  PROCESSING
}

enum PaymentMethod {
  PIX
  CARD
}

type CheckoutOperation {
  id: ID!
  operationKey: ID!
  status: CheckoutStatus!
}

type OrderWorkflow {
  state: WorkflowState!
}

enum CheckoutStatus {
  PENDING
  COMPLETED
  FAILED
}

enum WorkflowState {
  CREATED
  PAYMENT_PENDING
  PAYMENT_AUTHORIZED
  STOCK_PENDING
  COMPLETED
  STOCK_FAILED
  REFUND_PENDING
  REFUNDED
  CANCELLED
  PIX_PENDING
  PIX_GENERATED
}

input CheckoutInput {
  operationKey: ID!
  paymentMethod: PaymentMethod!
}

type Query {
  me: User
  customer: Customer
  cart: Cart
  products(first: Int, after: String): ProductConnection
  product(id: ID!): Product
  checkout(id: ID!): CheckoutOperation
}

type Mutation {
  addToCart(input: AddToCartInput!): AddToCartPayload
  checkout(input: CheckoutInput!): Order!
}

type Subscription {
  orderEvents(operationKey: ID!): OrderEvent!
}

type OrderEvent {
  operationKey: ID!
  orderId: ID!
  state: WorkflowState!
  pixCode: String
  eventTime: String!
}
