spring:
  application:
    name: payment-federation
  flyway:
    create-schemas: true
    default-schema: axon
    schemas: axon,transaction,inventory,payment
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: axon
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH_ISSUER:http://identity.localhost:3001/api/auth}
          jwk-set-uri: ${IDENTITY_JWKS_URL:http://identity-subgraph:3001/api/auth/jwks}
          audiences:
            - ${PAYMENT_OAUTH_AUDIENCE:https://payment.marketplace.local}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://rabbitmq:5672}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
    publisher-confirm-type: simple
    publisher-returns: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
payment:
  provider:
    mode: ${PAYMENT_PROVIDER_MODE:}
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    api-base-url: ${MERCADO_PAGO_API_BASE_URL:}
    connection-timeout: ${MERCADO_PAGO_CONNECTION_TIMEOUT:}
    read-timeout: ${MERCADO_PAGO_READ_TIMEOUT:}
axon:
  axonserver:
    enabled: false
---
spring:
  config:
    activate:
      on-profile: "local | test"
payment:
  provider:
    mode: ${PAYMENT_PROVIDER_MODE:deterministic}
---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: none
