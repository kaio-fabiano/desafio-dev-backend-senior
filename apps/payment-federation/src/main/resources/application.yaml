spring:
  application:
    name: payment-federation
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://rabbitmq:5672}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
    publisher-confirm-type: simple
    publisher-returns: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
payment:
  provider:
    mode: ${PAYMENT_PROVIDER_MODE:}
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    api-base-url: ${MERCADO_PAGO_API_BASE_URL:}
    connection-timeout: ${MERCADO_PAGO_CONNECTION_TIMEOUT:}
    read-timeout: ${MERCADO_PAGO_READ_TIMEOUT:}
---
spring:
  config:
    activate:
      on-profile: "local | test"
payment:
  provider:
    mode: ${PAYMENT_PROVIDER_MODE:deterministic}
