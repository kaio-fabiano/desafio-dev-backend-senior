spring:
  application:
    name: payment-processor
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://localhost:5672}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        default-requeue-rejected: false
    publisher-confirm-type: simple
    publisher-returns: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
