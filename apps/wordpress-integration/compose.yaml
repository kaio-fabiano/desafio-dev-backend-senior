name: wordpress-integration

services:
  database:
    image: mariadb:11.8.3
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress-root
      MARIADB_USER: wordpress
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - database-data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DEBUG: '1'
      MARKETPLACE_FEDERATION_SECRET: ${WPGRAPHQL_FEDERATION_SECRET:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('MARKETPLACE_FEDERATION_SECRET', getenv('MARKETPLACE_FEDERATION_SECRET'));
    ports:
      - '127.0.0.1:18080:80'
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1/wp-login.php']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - wordpress-data:/var/www/html
      - ./marketplace-inventory.php:/var/www/html/wp-content/mu-plugins/marketplace-inventory.php:ro

  cli:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      database:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
    user: '33:33'
    volumes:
      - wordpress-data:/var/www/html
      - ./marketplace-inventory.php:/var/www/html/wp-content/mu-plugins/marketplace-inventory.php:ro

  wordpress-federation:
    image: node:24.8.0-bookworm-slim
    depends_on:
      wordpress:
        condition: service_healthy
    working_dir: /workspace
    command:
      - corepack
      - pnpm@10.17.1
      - exec
      - nx
      - serve
      - '@desafio-dev-backend-senior/wordpress-federation'
    environment:
      PORT: '3004'
      WPGRAPHQL_ENDPOINT: http://wordpress/graphql
      WPGRAPHQL_FEDERATION_SECRET: ${WPGRAPHQL_FEDERATION_SECRET:-}
    ports:
      - '127.0.0.1:18081:3004'
    volumes:
      - ../..:/workspace

volumes:
  database-data:
  wordpress-data:
