services:
  rabbitmq:
    image: rabbitmq:4.1.3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: commerce
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  payment-database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: payment
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - payment-database-data:/var/lib/postgresql/data

  wordpress-database:
    image: mariadb:11.8.3
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress-root
      MARIADB_USER: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - wordpress-database-data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    depends_on:
      wordpress-database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/wp-login.php"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - wordpress-data:/var/www/html

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      COMMERCE_SUBSCRIPTION_URL: http://commerce-subgraph:3003/graphql/stream
      GATEWAY_AUDIENCE: https://gateway.marketplace.local
      OAUTH_ISSUER: http://identity-subgraph:3001/api/auth
      PORT: 3000
    depends_on:
      commerce-subgraph:
        condition: service_healthy
      identity-subgraph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  apollo-mcp:
    build:
      context: .
      dockerfile: apps/apollo-mcp/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
      identity-subgraph:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  identity-subgraph:
    build:
      context: .
      dockerfile: apps/identity-subgraph/Dockerfile
    environment:
      PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  commerce-subgraph:
    build:
      context: .
      dockerfile: apps/commerce-subgraph/Dockerfile
    environment:
      COMMERCE_DB_HOST: postgres
      COMMERCE_DB_NAME: commerce
      COMMERCE_DB_PASSWORD: postgres
      COMMERCE_DB_USER: postgres
      PORT: 3003
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      wordpress:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  payment-processor:
    build:
      context: .
      dockerfile: apps/payment-processor/Dockerfile
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-database:5432/payment
      SPRING_DATASOURCE_USERNAME: postgres
    depends_on:
      payment-database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 35s

  stock-worker:
    build:
      context: .
      dockerfile: apps/stock-worker/Dockerfile
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      STOCK_DB_HOST: postgres
      WOO_URL: http://wordpress
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(5672, 'rabbitmq').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 35s

volumes:
  postgres-data:
  payment-database-data:
  wordpress-database-data:
  wordpress-data:
