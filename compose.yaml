x-federated-node-build: &federated-node-build
  context: .
  dockerfile_inline: |
    FROM node:24.19.0-bookworm-slim AS dependencies
    WORKDIR /workspace
    RUN corepack enable
    COPY package.json pnpm-lock.yaml pnpm-workspace.yaml ./
    RUN pnpm install --config.minimumReleaseAge=0 --frozen-lockfile --prod

    FROM node:24.19.0-bookworm-slim AS runtime
    WORKDIR /workspace
    ENV NODE_ENV=production
    RUN groupadd --gid 10001 app && useradd --uid 10001 --gid app --create-home app
    COPY --from=dependencies --chown=app:app /workspace/node_modules ./node_modules
    COPY --chown=app:app package.json ./package.json
    COPY --chown=app:app apps/gateway ./apps/gateway
    COPY --chown=app:app apps/identity-subgraph ./apps/identity-subgraph
    COPY --chown=app:app libs/contracts/graphql ./libs/contracts/graphql
    COPY --chown=app:app libs/gateway/nest ./libs/gateway/nest
    COPY --chown=app:app libs/identity/nest ./libs/identity/nest
    COPY --chown=app:app libs/platform/nest ./libs/platform/nest
    USER app

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ['observability']
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - '4317'
      - '4318'

  jaeger:
    image: jaegertracing/all-in-one:1.73.0
    profiles: ['observability']
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686'

  rabbitmq:
    image: rabbitmq:4.1.3-management
    environment:
      HOME: /tmp
      RABBITMQ_ERLANG_COOKIE: local-development-cookie
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30
    tmpfs:
      - /tmp:mode=0777

  order-workflow-database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: order_workflow
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d order_workflow']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - order-workflow-database-data:/var/lib/postgresql/data

  identity-database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: identity
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d identity']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - identity-database-data:/var/lib/postgresql/data

  payment-database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: payment
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d payment']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - payment-database-data:/var/lib/postgresql/data

  wordpress-database:
    image: mariadb:11.8.3
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress-root
      MARIADB_USER: wordpress
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - wordpress-database-data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    depends_on:
      wordpress-database:
        condition: service_healthy
    environment:
      WPGRAPHQL_SITE_TOKEN: ${WPGRAPHQL_SITE_TOKEN:-wordpress-local-only}
      WORDPRESS_DB_HOST: wordpress-database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define('DISABLE_WP_CRON', true);
    healthcheck:
      test:
        ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1/readme.html']
      interval: 2s
      timeout: 2s
      retries: 60
    ports:
      - '80'
    volumes:
      - wordpress-data:/var/www/html
    networks:
      default:
        aliases:
          - wordpress-integration

  wordpress-setup:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WPGRAPHQL_SITE_TOKEN: ${WPGRAPHQL_SITE_TOKEN:-wordpress-local-only}
      WORDPRESS_DB_HOST: wordpress-database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
    user: '33:33'
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        wp core is-installed || wp core install --url=http://wordpress --title='Marketplace' --admin_user=admin --admin_password=admin-local-only --admin_email=admin@example.test --skip-email
        wp plugin install https://downloads.wordpress.org/plugin/woocommerce.10.4.3.zip --activate --force
        wp plugin install https://downloads.wordpress.org/plugin/wp-graphql.2.20.0.zip --activate --force
        wp plugin install https://github.com/wp-graphql/wp-graphql-woocommerce/releases/download/v1.0.3/wp-graphql-woocommerce.zip --activate --force
        wp plugin install https://github.com/AxeWP/wp-graphql-headless-login/releases/download/0.4.4/wp-graphql-headless-login.zip --activate --force
        wp plugin install https://github.com/Manuel-Antunes/wp-graphql-federations/archive/ac480974ceb6a1680410f955005e060056f150da.zip --force
        wp plugin activate wp-graphql-federations
        install -d /var/www/html/wp-content/plugins/order-workflow-reconciliation
        cp /integration/plugins/order-workflow-reconciliation/order-workflow-reconciliation.php /var/www/html/wp-content/plugins/order-workflow-reconciliation/order-workflow-reconciliation.php
        wp plugin activate order-workflow-reconciliation
        wp option update woocommerce_currency BRL
        wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery"}' --format=json
        wp option update wpgraphql_federation_settings '{"Order":{"enabled":true,"key":"id","kind":"post_type","wp_name":"shop_order"},"SimpleProduct":{"enabled":true,"key":"id","kind":"post_type","wp_name":"product"},"VariableProduct":{"enabled":true,"key":"id","kind":"post_type","wp_name":"product"},"ExternalProduct":{"enabled":true,"key":"id","kind":"post_type","wp_name":"product"},"GroupProduct":{"enabled":true,"key":"id","kind":"post_type","wp_name":"product"}}' --format=json
        wp option update wpgraphql_login_provider_siteToken "{\"isEnabled\":true,\"clientOptions\":{\"headerKey\":\"X-WPGraphQL-Site-Token\",\"secretKey\":\"$${WPGRAPHQL_SITE_TOKEN}\"},\"loginOptions\":{\"metaKey\":\"better_auth_user_id\"}}" --format=json
        wp option update wpgraphql_login_access_control '{"shouldBlockUnauthorizedDomains":true,"hasSiteAddressInOrigin":true,"additionalAuthorizedDomains":["http://wordpress"],"customHeaders":[]}' --format=json
        wp user get payment-federation || wp user create payment-federation payment-federation@example.test --role=shop_manager --user_pass=payment-federation-local-only
        wp user meta update payment-federation better_auth_user_id payment-federation
        wp user get order-workflow || wp user create order-workflow order-workflow@example.test --role=shop_manager --user_pass=order-workflow-local-only
        wp user meta update order-workflow better_auth_user_id order-workflow
        wp role create identity_registrar 'Identity Registrar' || true
        wp cap add identity_registrar read list_users edit_users delete_users
        wp user get identity-registrar || wp user create identity-registrar identity-registrar@marketplace.local --role=identity_registrar --user_pass=identity-registrar-local-only
        wp user update identity-registrar --role=identity_registrar
        wp user meta update identity-registrar better_auth_user_id identity-registrar
        wp role create marketplace_vendor 'Marketplace Vendor' || true
        wp cap add marketplace_vendor read edit_products edit_published_products publish_products
        wp cap remove marketplace_vendor edit_others_products || true
        wp user get vendor-alpha || wp user create vendor-alpha vendor-alpha@example.test --role=marketplace_vendor --user_pass=vendor-alpha-local-only
        wp user get vendor-beta || wp user create vendor-beta vendor-beta@example.test --role=marketplace_vendor --user_pass=vendor-beta-local-only
        wp user update vendor-alpha --user_email=vendor-alpha@example.test --role=marketplace_vendor --user_pass=vendor-alpha-local-only
        wp user update vendor-beta --user_email=vendor-beta@example.test --role=marketplace_vendor --user_pass=vendor-beta-local-only
        wp post get 1001 >/dev/null 2>&1 || wp post create --post_type=product --post_status=publish --post_title='Alpha product' --import_id=1001
        wp post meta update 1001 _sku POC-ALPHA
        wp post meta update 1001 _regular_price 19.90
        wp post meta update 1001 _price 19.90
        wp post meta update 1001 _manage_stock yes
        wp post meta update 1001 _stock 100
        wp post meta update 1001 _stock_status instock
        wp post term set 1001 product_type simple --by=slug
        wp post list --post_type=product --meta_key=_sku --meta_value=POC-BETA --field=ID --format=ids | grep -q . || wp wc product create --user=admin --name='Beta product' --type=simple --regular_price=29.90 --sku=POC-BETA --status=publish
        wp post list --post_type=product --meta_key=_sku --meta_value=POC-GAMMA --field=ID --format=ids | grep -q . || wp wc product create --user=admin --name='Gamma product' --type=simple --regular_price=39.90 --sku=POC-GAMMA --status=publish
        alpha_user_id="$$(wp user get vendor-alpha --field=ID)"
        beta_user_id="$$(wp user get vendor-beta --field=ID)"
        beta_product_id="$$(wp post list --post_type=product --meta_key=_sku --meta_value=POC-BETA --field=ID --format=ids)"
        gamma_product_id="$$(wp post list --post_type=product --meta_key=_sku --meta_value=POC-GAMMA --field=ID --format=ids)"
        wp post update 1001 --post_author="$$alpha_user_id" --post_title='Alpha product' --post_status=publish
        wp wc product update "$$beta_product_id" --user=admin --name='Beta product' --type=simple --regular_price=29.90 --status=publish
        wp wc product update "$$gamma_product_id" --user=admin --name='Gamma product' --type=simple --regular_price=39.90 --status=publish
        wp post update "$$beta_product_id" --post_author="$$beta_user_id"
        wp post update "$$gamma_product_id" --post_author="$$beta_user_id"
        wp rewrite structure '/%postname%/' --hard
        wp cache flush
        until wp post get 1001 >/dev/null 2>&1; do sleep 1; done
        touch /tmp/wordpress-setup-ready
        while true; do wp cron event run --due-now || true; sleep 1; done
    healthcheck:
      test: ['CMD', 'test', '-f', '/tmp/wordpress-setup-ready']
      interval: 1s
      timeout: 1s
      retries: 300
      start_period: 30s
    volumes:
      - ./apps/wordpress-integration:/integration:ro
      - wordpress-data:/var/www/html

  gateway:
    build: *federated-node-build
    command: ['node', '--import', 'tsx', 'apps/gateway/src/main.ts']
    environment:
      NODE_OPTIONS: ${OTEL_NODE_OPTIONS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: gateway
      GATEWAY_AUDIENCE: https://gateway.marketplace.local
      IDENTITY_JWKS_URL: http://identity.localhost:3001/api/auth/jwks
      OAUTH_ISSUER: http://identity.localhost:3001/api/auth
      PORT: 3000
      WORDPRESS_GRAPHQL_URL: http://wordpress/graphql
    depends_on:
      order-workflow-subgraph:
        condition: service_healthy
      wordpress-setup:
        condition: service_healthy
      payment-federation:
        condition: service_healthy
      identity-subgraph:
        condition: service_healthy
    ports:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  apollo-mcp:
    build:
      context: .
      dockerfile: apps/apollo-mcp/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
      identity-subgraph:
        condition: service_healthy
    ports:
      - '${MCP_PORT:-8000}:8000'
    healthcheck:
      test:
        [
          'CMD',
          '/bin/wget',
          '--quiet',
          '--spider',
          'http://127.0.0.1:8000/health',
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  identity-subgraph:
    build: *federated-node-build
    command: ['node', '--import', 'tsx', 'apps/identity-subgraph/src/main.ts']
    environment:
      NODE_OPTIONS: ${OTEL_NODE_OPTIONS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: identity-subgraph
      BETTER_AUTH_SECRET: local-development-secret-change-me
      IDENTITY_JWKS_URL: http://identity.localhost:3001/api/auth/jwks
      IDENTITY_OAUTH_AUDIENCE: https://identity.marketplace.local
      DATABASE_URL: postgresql://postgres:postgres@identity-database:5432/identity
      DATABASE_SSL: 'false'
      IDENTITY_BASE_URL: http://identity.localhost:3001
      IDENTITY_TRUSTED_ORIGINS: http://127.0.0.1:*,http://localhost:*
      OAUTH_ISSUER: http://identity.localhost:3001/api/auth
      PORT: 3001
      SEED_ADMIN_EMAIL: admin@marketplace.local
      SEED_ADMIN_PASSWORD: local-e2e-admin-password-change-me
      WORDPRESS_URL: http://wordpress
      WPGRAPHQL_SITE_TOKEN: ${WPGRAPHQL_SITE_TOKEN:-wordpress-local-only}
    depends_on:
      identity-database:
        condition: service_healthy
      wordpress-setup:
        condition: service_healthy
    ports:
      - '3001'
    networks:
      default:
        aliases:
          - identity.localhost
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  order-workflow-subgraph:
    build:
      context: .
      dockerfile: apps/order-workflow-subgraph/Dockerfile
    environment:
      NODE_OPTIONS: ${OTEL_NODE_OPTIONS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_SERVICE_NAME: order-workflow-subgraph
      ORDER_WORKFLOW_DB_HOST: order-workflow-database
      ORDER_WORKFLOW_DB_NAME: order_workflow
      ORDER_WORKFLOW_DB_PASSWORD: postgres
      ORDER_WORKFLOW_DB_SSL: 'false'
      ORDER_WORKFLOW_DB_USER: postgres
      IDENTITY_JWKS_URL: http://identity.localhost:3001/api/auth/jwks
      OAUTH_ISSUER: http://identity.localhost:3001/api/auth
      ORDER_WORKFLOW_OAUTH_AUDIENCE: https://order-workflow.marketplace.local
      PORT: 3003
      RABBITMQ_URL: amqp://rabbitmq:5672
      WORDPRESS_URL: http://wordpress
      WPGRAPHQL_SITE_TOKEN: ${WPGRAPHQL_SITE_TOKEN:-wordpress-local-only}
    depends_on:
      order-workflow-database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wordpress-setup:
        condition: service_healthy
    ports:
      - '3003'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3003/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 35s

  payment-federation:
    build:
      context: .
      dockerfile: apps/payment-federation/Dockerfile
    environment:
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      MANAGEMENT_TRACING_ENABLED: ${OTEL_ENABLED:-false}
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: '1.0'
      OTEL_SERVICE_NAME: payment-federation
      IDENTITY_JWKS_URL: http://identity.localhost:3001/api/auth/jwks
      OAUTH_ISSUER: http://identity.localhost:3001/api/auth
      PAYMENT_OAUTH_AUDIENCE: https://payment.marketplace.local
      PAYMENT_PROVIDER_MODE: ${PAYMENT_PROVIDER_MODE:-deterministic}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      MERCADO_PAGO_API_BASE_URL: ${MERCADO_PAGO_API_BASE_URL:-https://api.mercadopago.com}
      MERCADO_PAGO_CONNECTION_TIMEOUT: ${MERCADO_PAGO_CONNECTION_TIMEOUT:-5s}
      MERCADO_PAGO_READ_TIMEOUT: ${MERCADO_PAGO_READ_TIMEOUT:-15s}
      SERVER_PORT: 8080
      RABBITMQ_URL: amqp://rabbitmq:5672
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-database:5432/payment
      SPRING_DATASOURCE_USERNAME: postgres
      WORDPRESS_URL: http://wordpress
      WORDPRESS_GRAPHQL_URL: http://wordpress/graphql
      WPGRAPHQL_SITE_TOKEN: ${WPGRAPHQL_SITE_TOKEN:-wordpress-local-only}
    depends_on:
      payment-database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wordpress-setup:
        condition: service_healthy
    ports:
      - '8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl --fail --silent http://127.0.0.1:8080/actuator/health',
        ]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 35s

volumes:
  order-workflow-database-data:
  identity-database-data:
  payment-database-data:
  wordpress-database-data:
  wordpress-data:
