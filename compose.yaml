services:
  rabbitmq:
    image: rabbitmq:4.1.3-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: commerce
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d commerce"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  identity-database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: identity
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d identity"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - identity-database-data:/var/lib/postgresql/data

  payment-database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: payment
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - payment-database-data:/var/lib/postgresql/data

  wordpress-database:
    image: mariadb:11.8.3
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress-root
      MARIADB_USER: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - wordpress-database-data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    depends_on:
      wordpress-database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1/wp-login.php"]
      interval: 2s
      timeout: 2s
      retries: 60
    volumes:
      - wordpress-data:/var/www/html
    networks:
      default:
        aliases:
          - wordpress-integration

  wordpress-setup:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wordpress-database
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_USER: wordpress
    user: "33:33"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        wp core is-installed || wp core install --url=http://wordpress --title='Marketplace' --admin_user=admin --admin_password=admin-local-only --admin_email=admin@example.test --skip-email
        wp plugin install https://downloads.wordpress.org/plugin/woocommerce.10.4.3.zip --activate --force
        wp plugin install https://downloads.wordpress.org/plugin/wp-graphql.2.20.0.zip --activate --force
        wp plugin install https://github.com/wp-graphql/wp-graphql-woocommerce/releases/download/v1.0.3/wp-graphql-woocommerce.zip --activate --force
        wp plugin install https://github.com/Manuel-Antunes/wp-graphql-federations/archive/ac480974ceb6a1680410f955005e060056f150da.zip --force
        wp plugin activate wp-graphql-federations
        wp option update wpgraphql_federation_settings '{"Order":{"enabled":true,"key":"id","kind":"post_type","wp_name":"shop_order"},"SimpleProduct":{"enabled":true,"key":"id","kind":"post_type","wp_name":"product"},"VariableProduct":{"enabled":true,"key":"id","kind":"post_type","wp_name":"product"},"ExternalProduct":{"enabled":true,"key":"id","kind":"post_type","wp_name":"product"},"GroupProduct":{"enabled":true,"key":"id","kind":"post_type","wp_name":"product"}}' --format=json
        wp role create marketplace_vendor 'Marketplace Vendor' || true
        wp cap add marketplace_vendor read edit_products edit_published_products publish_products
        wp cap remove marketplace_vendor edit_others_products || true
        wp user get vendor-alpha || wp user create vendor-alpha vendor-alpha@example.test --role=marketplace_vendor --user_pass=vendor-alpha-local-only
        wp user get vendor-beta || wp user create vendor-beta vendor-beta@example.test --role=marketplace_vendor --user_pass=vendor-beta-local-only
        wp post list --post_type=product --meta_key=_sku --meta_value=POC-ALPHA --field=ID --format=ids | grep -q . || wp wc product create --user=admin --name='Alpha product' --type=simple --regular_price=19.90 --sku=POC-ALPHA --status=publish
        wp post list --post_type=product --meta_key=_sku --meta_value=POC-BETA --field=ID --format=ids | grep -q . || wp wc product create --user=admin --name='Beta product' --type=simple --regular_price=29.90 --sku=POC-BETA --status=publish
        wp post list --post_type=product --meta_key=_sku --meta_value=POC-GAMMA --field=ID --format=ids | grep -q . || wp wc product create --user=admin --name='Gamma product' --type=simple --regular_price=39.90 --sku=POC-GAMMA --status=publish
        wp rewrite structure '/%postname%/' --hard
        wp cache flush
    volumes:
      - wordpress-data:/var/www/html

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      COMMERCE_SUBSCRIPTION_URL: http://commerce-subgraph:3003/graphql/stream
      GATEWAY_AUDIENCE: https://gateway.marketplace.local
      OAUTH_ISSUER: https://identity-subgraph:3001/api/auth
      PORT: 3000
    depends_on:
      commerce-subgraph:
        condition: service_healthy
      identity-subgraph:
        condition: service_healthy
    ports:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  apollo-mcp:
    build:
      context: .
      dockerfile: apps/apollo-mcp/Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
      identity-subgraph:
        condition: service_healthy
    ports:
      - "${MCP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "/bin/wget", "--quiet", "--spider", "http://127.0.0.1:8000/health"]
      interval: 2s
      timeout: 2s
      retries: 30

  identity-subgraph:
    build:
      context: .
      dockerfile: apps/identity-subgraph/Dockerfile
    environment:
      BETTER_AUTH_SECRET: local-development-secret-change-me
      DATABASE_URL: postgresql://postgres:postgres@identity-database:5432/identity
      IDENTITY_BASE_URL: http://identity-subgraph:3001
      OAUTH_ISSUER: https://identity-subgraph:3001/api/auth
      PORT: 3001
      SEED_ADMIN_EMAIL: admin@marketplace.local
      SEED_ADMIN_PASSWORD: local-e2e-admin-password-change-me
    depends_on:
      identity-database:
        condition: service_healthy
    ports:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  commerce-subgraph:
    build:
      context: .
      dockerfile: apps/commerce-subgraph/Dockerfile
    environment:
      COMMERCE_DB_HOST: postgres
      COMMERCE_DB_NAME: commerce
      COMMERCE_DB_PASSWORD: postgres
      COMMERCE_DB_USER: postgres
      PORT: 3003
      RABBITMQ_URL: amqp://rabbitmq:5672
      WORDPRESS_URL: http://wordpress
      WOO_CONSUMER_KEY: local-e2e-consumer
      WOO_CONSUMER_SECRET: local-e2e-secret
    depends_on:
      postgres:
        condition: service_healthy
      wordpress:
        condition: service_healthy
      wordpress-setup:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/ready').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30

  payment-processor:
    build:
      context: .
      dockerfile: apps/payment-processor/Dockerfile
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-database:5432/payment
      SPRING_DATASOURCE_USERNAME: postgres
    depends_on:
      payment-database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/actuator/health"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 35s

  stock-worker:
    build:
      context: .
      dockerfile: apps/stock-worker/Dockerfile
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      STOCK_DB_HOST: postgres
      WOO_URL: http://wordpress
      WOO_CONSUMER_KEY: local-e2e-consumer
      WOO_CONSUMER_SECRET: local-e2e-secret
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(5672, 'rabbitmq').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 35s

volumes:
  postgres-data:
  identity-database-data:
  payment-database-data:
  wordpress-database-data:
  wordpress-data:
