<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title description">
  <title id="title">Current marketplace architecture</title>
  <desc id="description">As-is runtime architecture showing clients, Apollo MCP, the federated GraphQL gateway, four subgraphs, databases, RabbitMQ, WordPress and external payment services.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#fbbf24"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #94a3b8; }
      .section { font: 700 15px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.8px; fill: #94a3b8; }
      .name { font: 700 19px Inter, ui-sans-serif, system-ui, sans-serif; fill: #f8fafc; }
      .detail { font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .small { font: 600 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; }
      .box { stroke-width: 1.5; rx: 15; filter: url(#shadow); }
      .edge { fill: none; stroke: #94a3b8; stroke-width: 2.2; marker-end: url(#arrow); }
      .sync { fill: none; stroke: #38bdf8; stroke-width: 2.4; marker-end: url(#arrow-blue); }
      .sync-line { fill: none; stroke: #38bdf8; stroke-width: 2.4; }
      .async { fill: none; stroke: #fbbf24; stroke-width: 2.4; marker-end: url(#arrow-amber); }
      .optional { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1100" fill="url(#background)"/>
  <text x="70" y="64" class="title">Current architecture · as-is</text>
  <text x="70" y="94" class="subtitle">Marketplace B2B · Nx monorepo · GraphQL Federation · choreographed saga</text>

  <text x="70" y="145" class="section">CLIENTS</text>
  <rect x="70" y="165" width="250" height="90" class="box" fill="#172554" stroke="#3b82f6"/>
  <text x="195" y="202" text-anchor="middle" class="name">Web / E2E client</text>
  <text x="195" y="229" text-anchor="middle" class="detail">GraphQL + SSE · OAuth2</text>
  <rect x="370" y="165" width="250" height="90" class="box" fill="#172554" stroke="#3b82f6"/>
  <text x="495" y="202" text-anchor="middle" class="name">AI agent</text>
  <text x="495" y="229" text-anchor="middle" class="detail">Authenticated MCP client</text>

  <text x="700" y="145" class="section">EDGE</text>
  <rect x="700" y="165" width="250" height="90" class="box" fill="#3b0764" stroke="#a855f7"/>
  <text x="825" y="202" text-anchor="middle" class="name">Apollo MCP</text>
  <text x="825" y="229" text-anchor="middle" class="detail">Curated supergraph operations</text>
  <rect x="1030" y="165" width="360" height="90" class="box" fill="#3b0764" stroke="#a855f7"/>
  <text x="1210" y="199" text-anchor="middle" class="name">NestJS Apollo Gateway</text>
  <text x="1210" y="225" text-anchor="middle" class="detail">Federation v2 · JWT · context propagation</text>
  <text x="1210" y="244" text-anchor="middle" class="small">/graphql · /graphql/stream</text>

  <path d="M195 255 V275 H1090 Q1110 275 1110 255" class="sync"/>
  <text x="650" y="268" text-anchor="middle" class="small">Bearer JWT · GraphQL</text>
  <path d="M620 210 H680 Q700 210 700 210" class="sync"/>
  <path d="M950 210 H1030" class="sync"/>
  <text x="990" y="196" text-anchor="middle" class="small">GraphQL</text>

  <text x="70" y="330" class="section">FEDERATED GRAPH</text>
  <rect x="55" y="350" width="1490" height="330" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="90" y="390" width="310" height="120" class="box" fill="#0c4a6e" stroke="#0ea5e9"/>
  <text x="245" y="428" text-anchor="middle" class="name">Identity Federation</text>
  <text x="245" y="456" text-anchor="middle" class="detail">NestJS · Better Auth · OAuth2 AS</text>
  <text x="245" y="482" text-anchor="middle" class="detail">users · sessions · registration</text>

  <rect x="455" y="390" width="330" height="120" class="box" fill="#064e3b" stroke="#10b981"/>
  <text x="620" y="428" text-anchor="middle" class="name">Order Workflow Federation</text>
  <text x="620" y="456" text-anchor="middle" class="detail">NestJS · MikroORM · outbox/inbox</text>
  <text x="620" y="482" text-anchor="middle" class="detail">checkout · saga · durable SSE relay</text>

  <rect x="840" y="390" width="310" height="120" class="box" fill="#7c2d12" stroke="#f97316"/>
  <text x="995" y="428" text-anchor="middle" class="name">Payment Federation</text>
  <text x="995" y="456" text-anchor="middle" class="detail">Java · Spring Boot · Spring GraphQL</text>
  <text x="995" y="482" text-anchor="middle" class="detail">payment + inventory boundaries</text>

  <rect x="1205" y="390" width="300" height="120" class="box" fill="#4c1d1d" stroke="#ef4444"/>
  <text x="1355" y="428" text-anchor="middle" class="name">WordPress / WooCommerce</text>
  <text x="1355" y="456" text-anchor="middle" class="detail">WPGraphQL native subgraph</text>
  <text x="1355" y="482" text-anchor="middle" class="detail">catalog · carts · orders · stock</text>

  <path d="M1210 255 V325 H245" class="sync-line"/>
  <path d="M245 325 V390" class="sync"/>
  <path d="M620 325 V390" class="sync"/>
  <path d="M995 325 V390" class="sync"/>
  <path d="M1355 325 V390" class="sync"/>
  <text x="1110" y="316" text-anchor="end" class="small">Federation bus · four composed subgraphs</text>

  <rect x="90" y="560" width="310" height="75" class="box" fill="#1e293b" stroke="#64748b"/>
  <text x="245" y="591" text-anchor="middle" class="name">Identity PostgreSQL</text>
  <text x="245" y="616" text-anchor="middle" class="detail">Better Auth records</text>
  <rect x="455" y="560" width="330" height="75" class="box" fill="#1e293b" stroke="#64748b"/>
  <text x="620" y="591" text-anchor="middle" class="name">Workflow PostgreSQL</text>
  <text x="620" y="616" text-anchor="middle" class="detail">workflow · outbox · event replay</text>
  <rect x="840" y="560" width="310" height="75" class="box" fill="#1e293b" stroke="#64748b"/>
  <text x="995" y="591" text-anchor="middle" class="name">Payment PostgreSQL</text>
  <text x="995" y="616" text-anchor="middle" class="detail">aggregate · read view · inbox</text>
  <rect x="1205" y="560" width="300" height="75" class="box" fill="#1e293b" stroke="#64748b"/>
  <text x="1355" y="591" text-anchor="middle" class="name">MariaDB</text>
  <text x="1355" y="616" text-anchor="middle" class="detail">WordPress / WooCommerce data</text>

  <path d="M245 510 V560" class="edge"/>
  <path d="M620 510 V560" class="edge"/>
  <path d="M995 510 V560" class="edge"/>
  <path d="M1355 510 V560" class="edge"/>

  <text x="70" y="740" class="section">ASYNCHRONOUS PROCESSING AND EXTERNAL ADAPTERS</text>
  <rect x="550" y="775" width="390" height="130" class="box" fill="#422006" stroke="#f59e0b"/>
  <text x="745" y="815" text-anchor="middle" class="name">RabbitMQ</text>
  <text x="745" y="843" text-anchor="middle" class="detail">marketplace.events.v1 · topic exchange</text>
  <text x="745" y="869" text-anchor="middle" class="detail">quorum queues · manual ACK · retries · DLQ</text>

  <path d="M455 480 H425 V735 Q425 755 445 755 H640 V775" class="async"/>
  <text x="455" y="725" class="small">publish payment.requested</text>
  <path d="M900 775 V705 H1170 V535 H1050 Q1030 535 1030 510" class="async"/>
  <text x="925" y="698" class="small">consume payment / inventory commands</text>
  <path d="M840 480 H810 V745 Q810 765 830 765 H920 V775" class="async"/>
  <text x="820" y="725" class="small">publish result events</text>
  <path d="M550 865 H390 V500 Q390 480 410 480 H455" class="async"/>
  <text x="400" y="845" class="small">consume saga results</text>

  <path d="M785 490 V535 H1185 Q1205 535 1205 510" class="sync"/>
  <text x="995" y="528" text-anchor="middle" class="small">checkout / order adapter</text>
  <path d="M1150 450 H1205" class="sync"/>
  <text x="1178" y="438" text-anchor="middle" class="small">order + inventory</text>

  <rect x="1080" y="775" width="300" height="130" class="box" fill="#312e81" stroke="#6366f1"/>
  <text x="1230" y="815" text-anchor="middle" class="name">Payment provider</text>
  <text x="1230" y="843" text-anchor="middle" class="detail">Deterministic adapter (default)</text>
  <text x="1230" y="869" text-anchor="middle" class="detail">Mercado Pago (optional mode)</text>
  <path d="M1150 490 H1170 V755 Q1170 775 1190 775" class="sync"/>
  <text x="1182" y="745" class="small">authorize / refund</text>

  <rect x="70" y="960" width="360" height="80" class="box" fill="#1e293b" stroke="#64748b"/>
  <text x="250" y="993" text-anchor="middle" class="name">OpenTelemetry + Jaeger</text>
  <text x="250" y="1018" text-anchor="middle" class="detail">Optional Compose observability profile</text>
  <path d="M90 455 H50 V930 H250 V960" class="optional"/>
  <path d="M840 455 H795 V920 H250 V960" class="optional"/>
  <path d="M1390 210 H1535 V940 H250 V960" class="optional"/>

  <path d="M455 415 H430 V300 H195 V255" class="sync"/>
  <text x="315" y="292" text-anchor="middle" class="small">order events via Gateway SSE</text>

  <rect x="1110" y="975" width="420" height="55" rx="12" fill="#0f172a" stroke="#334155"/>
  <line x1="1140" y1="995" x2="1190" y2="995" stroke="#38bdf8" stroke-width="3"/>
  <text x="1205" y="1000" class="small">Synchronous HTTP / GraphQL</text>
  <line x1="1365" y1="995" x2="1415" y2="995" stroke="#fbbf24" stroke-width="3"/>
  <text x="1430" y="1000" class="small">AMQP events</text>
  <line x1="1140" y1="1017" x2="1190" y2="1017" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="1205" y="1022" class="small">Optional telemetry</text>
</svg>
