extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.11", import: ["@key"])

type User @key(fields: "id") {
  id: ID!
  email: String!
}

type SupplierCompany @key(fields: "id") {
  id: ID!
  name: String!
  members: [SupplierMembership!]!
}

type SupplierMembership {
  user: User!
  role: SupplierRole!
  validFrom: String!
  validUntil: String
}

enum SupplierRole {
  OWNER
  MANAGER
}

type Query {
  me: User
}
