extend schema
  @link(
    url: "https://specs.apollo.dev/federation/v2.11"
    import: ["@inaccessible", "@key", "@shareable"]
  )

# Normalized public publication contract. Runtime fields and resolvers remain
# owned by WPGraphQL, WPGraphQL for WooCommerce, and wp-graphql-federations.
# Identity registration calls native registerCustomer, updateCustomer,
# deleteUser, and login operations directly on the private WordPress endpoint;
# those administrative operations are deliberately not published here.
interface Product @key(fields: "id") {
  id: ID!
  databaseId: Int!
  name: String
  price: String
  sku: String
  stockQuantity: Int
  stockStatus: StockStatusEnum
}

type SimpleProduct implements Product @key(fields: "id") {
  id: ID!
  databaseId: Int!
  name: String
  price: String
  sku: String
  stockQuantity: Int
  stockStatus: StockStatusEnum
}

type VariableProduct implements Product @key(fields: "id") {
  id: ID!
  databaseId: Int!
  name: String
  price: String
  sku: String
  stockQuantity: Int
  stockStatus: StockStatusEnum
}

type ExternalProduct implements Product @key(fields: "id") {
  id: ID!
  databaseId: Int!
  name: String
  price: String
  sku: String
  stockQuantity: Int
  stockStatus: StockStatusEnum
}

type GroupProduct implements Product @key(fields: "id") {
  id: ID!
  databaseId: Int!
  name: String
  price: String
  sku: String
  stockQuantity: Int
  stockStatus: StockStatusEnum
}

enum StockStatusEnum {
  IN_STOCK
  OUT_OF_STOCK
  ON_BACKORDER
}

type ProductConnection {
  edges: [ProductEdge!]!
  nodes: [Product!]!
  pageInfo: PageInfo!
}

type ProductEdge {
  cursor: String!
  node: Product!
}

type Cart {
  contents: CartItemConnection
}

type CartItemConnection {
  edges: [CartItemEdge!]!
  nodes: [CartItem!]!
  pageInfo: PageInfo!
}

type CartItemEdge {
  cursor: String!
  node: CartItem!
}

type CartItem {
  key: ID!
  quantity: Int!
  product: Product
}

type Customer {
  id: ID!
  orders(first: Int, after: String): OrderConnection
}

type Order @key(fields: "id") {
  id: ID!
  databaseId: Int!
  status: OrderStatusEnum
  transactionId: String
  metaData: [MetaData]
  total: String
  currency: String
  lineItems(first: Int, after: String): OrderLineItemConnection
}

type OrderLineItemConnection {
  edges: [OrderLineItemEdge!]!
  nodes: [OrderLineItem!]!
  pageInfo: PageInfo!
}

type OrderLineItemEdge {
  cursor: String!
  node: OrderLineItem!
}

type OrderLineItem {
  quantity: Int
  product: Product
}

type MetaData {
  key: String
  value: String
}

type OrderConnection {
  edges: [OrderEdge!]!
  nodes: [Order!]!
  pageInfo: PageInfo!
}

type OrderEdge {
  cursor: String!
  node: Order!
}

type PageInfo @shareable {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

input AddToCartInput {
  clientMutationId: String
  productId: Int!
  quantity: Int
}

type AddToCartPayload {
  cart: Cart
  clientMutationId: String
}

input CheckoutInput {
  clientMutationId: String
  paymentMethod: String
  metaData: [MetaDataInput]
}

type CheckoutPayload {
  clientMutationId: String
  order: Order
}

enum OrderStatusEnum {
  COMPLETED
  PROCESSING
}

enum OrderIdTypeEnum {
  DATABASE_ID
}

input UpdateOrderInput {
  clientMutationId: String
  id: ID!
  status: OrderStatusEnum
  isPaid: Boolean
  transactionId: String
  metaData: [MetaDataInput]
}

input MetaDataInput {
  key: String!
  value: String!
}

type UpdateOrderPayload {
  clientMutationId: String
  order: Order
}

type Query {
  products(first: Int, after: String): ProductConnection
  product(id: ID!): Product
  cart: Cart
  customer: Customer
  order(id: ID!, idType: OrderIdTypeEnum): Order
}

type Mutation {
  addToCart(input: AddToCartInput!): AddToCartPayload
  checkout(input: CheckoutInput!): CheckoutPayload
  updateOrder(input: UpdateOrderInput!): UpdateOrderPayload
}
